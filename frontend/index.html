<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">

      <a class="navbar-brand" href="#">
        Expense Tracker
      </a>

      <button
        id="darkModeBtn"
        class="btn btn-light btn-sm"
        type="button"
      >
        Dark Mode
      </button>

    </div>
  </nav>


  <!-- Alerts -->
  <div class="container mt-3">
    <div id="alertContainer"></div>
  </div>


  <!-- Loading Spinner -->
  <div
    id="loadingSpinner"
    class="text-center my-4 d-none"
  >
    <div
      class="spinner-border"
      role="status"
    >
      <span class="visually-hidden">
        Loading...
      </span>
    </div>
  </div>


  <!-- Summary Cards -->
  <div class="container mt-4">

    <div class="summary-grid">

      <!-- Total Amount -->
      <div class="col-md-4">

        <div class="card text-center shadow-sm">

          <div class="card-body">

            <h5 class="card-title">
              Total Expenses
            </h5>

            <h2 id="totalAmount">
              0.00
            </h2>

          </div>

        </div>

      </div>


      <!-- Expense Count -->
      <div class="col-md-4">

        <div class="card text-center shadow-sm">

          <div class="card-body">

            <h5 class="card-title">
              Number of Expenses
            </h5>

            <h2 id="expenseCount">
              0
            </h2>

          </div>

        </div>

      </div>


      <!-- Highest Expense -->
      <div class="col-md-4">

        <div class="card text-center shadow-sm">

          <div class="card-body">

            <h5 class="card-title">
              Highest Expense
            </h5>

            <h2 id="highestExpense">
              0.00
            </h2>

            <span
              id="highestExpenseTitle"
              class="highest-expense-title"
            ></span>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- Add Expense Form -->
  <div class="container mt-5">

    <div class="card shadow-sm">

      <div class="card-body">

        <h3 class="mb-4">
          Add Expense
        </h3>

        <form id="expenseForm">

          <div class="row g-3">

            <!-- Title -->
            <div class="col-md-6">

              <label
                for="title"
                class="form-label"
              >
                Title
              </label>

              <input
                type="text"
                class="form-control"
                id="title"
                placeholder="Enter expense title"
              >

            </div>


            <!-- Amount -->
            <div class="col-md-6">

              <label
                for="amount"
                class="form-label"
              >
                Amount
              </label>

              <input
                type="number"
                class="form-control"
                id="amount"
                placeholder="Enter amount"
                step="0.01"
              >

            </div>


            <!-- Category -->
            <div class="col-md-6">

              <label
                for="category"
                class="form-label"
              >
                Category
              </label>

              <select
                class="form-select"
                id="category"
              >

                <option value="">
                  Select Category
                </option>

                <option value="Food">
                  Food
                </option>

                <option value="Transport">
                  Transport
                </option>

                <option value="Bills">
                  Bills
                </option>

                <option value="Entertainment">
                  Entertainment
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>


            <!-- Date -->
            <div class="col-md-6">

              <label
                for="date"
                class="form-label"
              >
                Date
              </label>

              <input
                type="date"
                class="form-control"
                id="date"
              >

            </div>

          </div>


          <button
            type="submit"
            class="btn btn-primary mt-4"
          >
            Add Expense
          </button>

        </form>

      </div>

    </div>

  </div>


  <!-- Expenses -->
  <div class="container mt-5 mb-5">

    <div class="card shadow-sm">

      <div class="card-body">

        <h3 class="mb-4">
          Expenses
        </h3>


        <!-- Filters -->
        <div class="row g-3 mb-4">

          <!-- Category Filter -->
          <div class="col-md-4">

            <label
              for="categoryFilter"
              class="form-label mb-1"
            >
              Filter by Category
            </label>

            <select
              class="form-select"
              id="categoryFilter"
            >

              <option value="All">
                All
              </option>

              <option value="Food">
                Food
              </option>

              <option value="Transport">
                Transport
              </option>

              <option value="Bills">
                Bills
              </option>

              <option value="Entertainment">
                Entertainment
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <!-- Search by Title -->
          <div class="col-md-4">

            <label
              for="titleSearch"
              class="form-label"
            >
              Search by Title
            </label>

            <input
              type="text"
              class="form-control"
              id="titleSearch"
              placeholder="Search expense..."
            >

          </div>


          <!-- Filter by Month -->
          <div class="col-md-4">

            <label
              for="monthFilter"
              class="form-label"
            >
              Filter by Month
            </label>

            <input
              type="month"
              class="form-control"
              id="monthFilter"
            >

          </div>

        </div>


        <!-- Export CSV -->
        <div class="mb-4">

          <button
            id="exportCsvBtn"
            class="btn btn-success"
            type="button"
          >
            Export CSV
          </button>

        </div>


        <!-- Expenses Table -->
        <div class="table-responsive">

          <table
            class="table table-striped table-hover align-middle"
          >

            <thead>

              <tr>

                <th>
                  <button
                    type="button"
                    class="btn btn-link text-decoration-none p-0"
                    onclick="sortExpenses('title')"
                  >
                    Title
                  </button>
                </th>

                <th>
                  <button
                    type="button"
                    class="btn btn-link text-decoration-none p-0"
                    onclick="sortExpenses('amount')"
                  >
                    Amount
                  </button>
                </th>

                <th>
                  <button
                    type="button"
                    class="btn btn-link text-decoration-none p-0"
                    onclick="sortExpenses('category')"
                  >
                    Category
                  </button>
                </th>

                <th>
                  <button
                    type="button"
                    class="btn btn-link text-decoration-none p-0"
                    onclick="sortExpenses('date')"
                  >
                    Date
                  </button>
                </th>

                <th>
                  Edit
                </th>

                <th>
                  Delete
                </th>

              </tr>

            </thead>


            <tbody id="expensesTableBody">

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>


  <!-- Expenses Chart -->
  <div class="container mt-5 mb-5">

    <h3>
      Expenses by Category
    </h3>

    <div class="card p-3">

      <canvas id="expensesChart"></canvas>

    </div>

  </div>


  <!-- Edit Modal -->
  <div
    class="modal fade"
    id="editModal"
    tabindex="-1"
    aria-labelledby="editModalLabel"
    aria-hidden="true"
  >

    <div class="modal-dialog">

      <div class="modal-content">

        <div class="modal-header">

          <h5
            class="modal-title"
            id="editModalLabel"
          >
            Edit Expense
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>

        </div>


        <div class="modal-body">

          <!-- Hidden ID -->
          <input
            type="hidden"
            id="editId"
          >


          <!-- Edit Title -->
          <div class="mb-3">

            <label
              for="editTitle"
              class="form-label"
            >
              Title
            </label>

            <input
              type="text"
              class="form-control"
              id="editTitle"
            >

          </div>


          <!-- Edit Amount -->
          <div class="mb-3">

            <label
              for="editAmount"
              class="form-label"
            >
              Amount
            </label>

            <input
              type="number"
              class="form-control"
              id="editAmount"
              step="0.01"
            >

          </div>


          <!-- Edit Category -->
          <div class="mb-3">

            <label
              for="editCategory"
              class="form-label"
            >
              Category
            </label>

            <select
              class="form-select"
              id="editCategory"
            >

              <option value="Food">
                Food
              </option>

              <option value="Transport">
                Transport
              </option>

              <option value="Bills">
                Bills
              </option>

              <option value="Entertainment">
                Entertainment
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <!-- Edit Date -->
          <div class="mb-3">

            <label
              for="editDate"
              class="form-label"
            >
              Date
            </label>

            <input
              type="date"
              class="form-control"
              id="editDate"
            >

          </div>

        </div>


        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Close
          </button>

          <button
            type="button"
            class="btn btn-primary"
            id="saveEditBtn"
          >
            Save Changes
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- Chart.js -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
  ></script>


  <!-- Custom JavaScript -->
  <script src="js/app.js"></script>

</body>
</html>
